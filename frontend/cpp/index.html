<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C++ Execution Visualizer</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      (function() {
        function applySavedTheme() {
          try {
            const mode = localStorage.getItem('stackstepper_mode') || 'dark';
            let scheme = localStorage.getItem('stackstepper_color_scheme') || 'default';
            if (scheme === 'default-dark' || scheme === 'default-light') scheme = 'default';
            if (scheme === 'github-dark' || scheme === 'github-light') scheme = 'github';
            if (scheme === 'vscode-dark') scheme = 'vscode';
            if (scheme === 'stackstepper-classic') scheme = 'stackstepper';
            document.documentElement.setAttribute('data-theme', mode);
            document.documentElement.setAttribute('data-color-scheme', scheme);
          } catch (e) {}
        }
        applySavedTheme();
        window.addEventListener('message', function(event) {
          if (event.data && event.data.type === 'STACKSTEPPER_THEME_CHANGE') {
            document.documentElement.setAttribute('data-theme', event.data.mode);
            document.documentElement.setAttribute('data-color-scheme', event.data.scheme);
          }
        });
      })();
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="/app.jsx" data-presets="react"></script>
  </body>
  </html>
